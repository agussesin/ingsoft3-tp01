name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Mostrar qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Ejecutar tests y coverage del backend
        working-directory: ./backend
        run: |
          dotnet test backend.sln \
            -c Release \
            /p:CollectCoverage=true \
            "/p:CoverletOutput=$PWD/coverage/coverage" \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=70 \
            "/p:ThresholdType=line%2cbranch" \
            "/p:Exclude=[ReservasApi]Program*%2c[ReservasApi]ReservasApi.Data.*%2c[ReservasApi]ReservasApi.Models.*%2c[ReservasApi]ReservasApi.Services.SystemClock"

      - name: Instalar ReportGenerator
        if: always()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar resumen de coverage del backend
        if: always()
        working-directory: ./backend
        run: |
          reportgenerator \
            -reports:"coverage/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"TextSummary;Html"

          cat coverage-report/Summary.txt

      - name: Guardar coverage del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/
            backend/coverage-report/

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Mostrar qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar tests y coverage del frontend
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Guardar coverage del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa

    steps:
      - name: Disparar deploy en Render (backend + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test QA
        shell: bash
        env:
          URL_API: https://reservas-api-qa.onrender.com
          URL_FRONT: https://reservas-front-qa-h1ki.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."

          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/reservas" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/reservas" > /dev/null; then
              echo "QA responde: API + BD + frontend + proxy /api/reservas"
              exit 0
            fi

            sleep 20
          done

          echo "QA no respondió a tiempo"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Integración contra la API de QA
        working-directory: ./frontend
        env:
          API_BASE_URL: https://reservas-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js --workers=1

      - name: Publicar reporte de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: integracion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E contra el frontend de QA
        working-directory: ./frontend
        env:
          E2E_BASE_URL: https://reservas-front-qa-h1ki.onrender.com
        run: npx playwright test e2e/reservas.spec.js --workers=1

      - name: Publicar reporte E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 30


  deploy-prod:
    runs-on: ubuntu-latest
    permissions: {}
    needs: e2e
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - name: Disparar deploy en Render PROD
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://reservas-api-prod-zulr.onrender.com
          URL_FRONT: https://reservas-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD responda..."

          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/reservas" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/reservas" > /dev/null; then
              echo "PROD responde: API + BD + frontend + proxy /api/reservas"
              exit 0
            fi

            sleep 20
          done

          echo "PROD no respondió a tiempo"
          exit 1
