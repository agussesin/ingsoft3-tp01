name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ejecutar tests y coverage del backend
        working-directory: ./backend
        run: |
          dotnet test backend.sln \
            -c Release \
            /p:CollectCoverage=true \
            "/p:CoverletOutput=$PWD/coverage/coverage" \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=74 \
            "/p:ThresholdType=line%2cbranch" \
            "/p:Exclude=[ReservasApi]Program*%2c[ReservasApi]ReservasApi.Data.*%2c[ReservasApi]ReservasApi.Models.*%2c[ReservasApi]ReservasApi.Services.SystemClock"

      - name: Instalar ReportGenerator
        if: always()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar resumen de coverage del backend
        if: always()
        working-directory: ./backend
        run: |
          reportgenerator \
            -reports:"coverage/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"TextSummary;Html"

          cat coverage-report/Summary.txt

      - name: Guardar coverage del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/
            backend/coverage-report/

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar tests y coverage del frontend
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Guardar coverage del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend